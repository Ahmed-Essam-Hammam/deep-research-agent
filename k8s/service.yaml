apiVersion: v1
kind: Service
metadata:
  name: deep-research-agent
  namespace: deep-research
  labels:
    app: deep-research-agent
spec:
  type: ClusterIP # internal only; the load balancer reaches the pods through the Ingress
  selector:
    app: deep-research-agent
  ports:
    - name: http # Prometheus refers to this port name
      port: 8000
      targetPort: http # container port 8000
