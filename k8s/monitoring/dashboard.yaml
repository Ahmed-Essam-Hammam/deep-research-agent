apiVersion: v1
kind: ConfigMap
metadata:
  name: deep-research-dashboard
  namespace: monitoring
  labels:
    # It is commonly used by the Grafana sidecar dashboard provider to discover ConfigMaps containing dashboards.
    # Think of it as a tag that tells the Grafana sidecar: "This ConfigMap contains a Grafana dashboard."
    grafana_dashboard: "1"
# data: Holds the configuration data.
# deep-research-agent.json: The key (filename).
# |: YAML block scalar that allows you to write multiline text while preserving line breaks.
data:
  deep-research-agent.json: |
    {
      "title": "Deep Research Agent",
      "uid": "deep-research-agent",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods up",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(up{namespace=\"deep-research\", job=\"deep-research-agent\"} == 1)",
              "legendFormat": "up"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests / s",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_requests_total{namespace=\"deep-research\"}[5m]))",
              "legendFormat": "total"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "5xx error ratio",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_requests_total{namespace=\"deep-research\", status=\"5xx\"}[5m])) / clamp_min(sum(rate(http_requests_total{namespace=\"deep-research\"}[5m])), 0.001)",
              "legendFormat": "5xx"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "p95 latency",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"deep-research\"}[5m])))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests / s by status",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (status) (rate(http_requests_total{namespace=\"deep-research\"}[5m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory per pod",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"deep-research\", pod=~\"deep-research-agent-.*\", container=\"app\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
