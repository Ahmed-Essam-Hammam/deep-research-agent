services:

  # PostgreSQL (pgvector)
  pgvector:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: pgvector
    ports:
      - "5400:5432"
    volumes:
      - 'pgvector:/var/lib/postgresql/data'
    env_file:
      - .env
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]     
      interval: 5s                                       
      timeout: 5s                                        
      retries: 5                                          
      start_period: 10s                                  


  # FastAPI application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deep_research_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-researchagent2222}@pgvector:5432/${POSTGRES_DB:-researchagent}
    depends_on:
      pgvector:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped


networks:
  backend:
    driver: bridge


volumes:
  pgvector: