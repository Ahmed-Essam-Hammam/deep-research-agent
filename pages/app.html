<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deep Research</title>
<link rel="stylesheet" href="shared.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand"><span class="brand-mark">Deep Research</span></div>
    <div class="topbar-right">
      <span class="status-dot" id="statusDot" title="API reachability"></span>
      <button class="linklike" id="apiSettingsBtn" type="button">API settings</button>
    </div>
  </header>

  <div class="api-settings-panel" id="apiSettingsPanel" hidden>
    <div class="field" style="margin-bottom:0;">
      <label for="baseUrlInput">API base URL</label>
      <input id="baseUrlInput" type="text" spellcheck="false" />
    </div>
  </div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="user-row">
        <div class="user-chip" id="sidebarUserChip">—</div>
        <div class="user-actions">
          <button class="linklike" id="changePasswordBtn" type="button">Change password</button>
          <button class="linklike" id="signOutBtn" type="button">Sign out</button>
        </div>
      </div>

      <div class="new-chat-wrap">
        <button class="btn btn-primary btn-block" id="newChatBtn" type="button">+ New conversation</button>
      </div>

      <div id="sidebarBanner"></div>

      <nav class="conv-nav" id="convNav">
        <div class="hint" style="padding:8px 4px;">Loading…</div>
      </nav>
    </aside>

    <main class="chat-main">
      <!-- Empty state: no conversation selected — start one -->
      <div class="chat-empty" id="chatEmpty">
        <div class="chat-empty-card">
          <h2>Start a conversation</h2>
          <p>Your first message becomes the conversation's title, generated by the LLM.</p>
          <div id="chatEmptyBanner"></div>
          <div class="field">
            <label for="newChatPrompt">First message</label>
            <textarea id="newChatPrompt" rows="4" placeholder="What is the capital of France?"></textarea>
          </div>
          <div class="field">
            <label for="newChatModel">Model type</label>
            <input id="newChatModel" type="text" placeholder="e.g. openrouter/auto" value="openrouter/auto" />
          </div>
          <button class="btn btn-primary btn-block" id="startConvBtn" type="button">Start conversation</button>
        </div>
      </div>

      <!-- Active conversation -->
      <div class="chat-active" id="chatActive" hidden>
        <header class="chat-header">
          <div>
            <div class="chat-header-title" id="chatTitle">—</div>
            <div class="chat-header-meta" id="chatMeta"></div>
          </div>
          <div class="chat-header-actions">
            <button class="btn btn-small" id="renameBtn" type="button">Rename</button>
            <button class="btn btn-small btn-danger" id="deleteBtn" type="button">Delete</button>
          </div>
        </header>
        <div id="chatBanner"></div>
        <div class="chat-thread" id="chatThread"></div>
        <div class="chat-composer">
          <textarea id="chatInput" rows="2" placeholder="Send a message… (Cmd/Ctrl+Enter to send)"></textarea>
          <button class="btn btn-primary" id="chatSendBtn" type="button">Send</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Change password modal -->
  <div class="modal-overlay" id="pwModal" hidden>
    <div class="modal-card">
      <h3>Change password</h3>
      <div id="pwBanner"></div>
      <form id="pwForm">
        <div class="field">
          <label for="pwCurrent">Current password</label>
          <input id="pwCurrent" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div class="field">
          <label for="pwNew">New password</label>
          <input id="pwNew" type="password" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="pwNewConfirm">Confirm new password</label>
          <input id="pwNewConfirm" type="password" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="pwSubmitBtn" type="submit">Update password</button>
          <button class="btn" id="pwCancelBtn" type="button">Cancel</button>
        </div>
      </form>
    </div>
  </div>

<script src="shared.js"></script>
<script>
  const session = requireAuth(); // redirects to login.html if there's no local session
  if (session) {
    (function () {
      "use strict";

      let username = session.username;
      let conversations = [];
      let activeConversationId = null;
      let activeConv = null;

      initTopbar();
      $("sidebarUserChip").textContent = username;

      // A 401 from any authenticated call means the token is no longer
      // valid server-side (expired/revoked) - bounce to a real sign-in page
      // with an explanation, rather than leaving a half-broken app on screen.
      function handleAuthError(err) {
        if (err && err.status === 401) {
          sessionExpired();
          return true;
        }
        return false;
      }

      // ===== Sidebar: conversation list =====

      async function loadConversations() {
        banner("sidebarBanner", null);
        try {
          conversations = await apiRequest("GET", "/conversations", { auth: true });
          renderConvNav();
          if (conversations.length && !activeConversationId) {
            selectConversation(conversations[0].id);
          } else if (!conversations.length) {
            showEmptyChat();
          }
        } catch (err) {
          if (handleAuthError(err)) return;
          $("convNav").innerHTML = "";
          banner("sidebarBanner", err.message, "error");
        }
      }

      function renderConvNav() {
        const nav = $("convNav");
        nav.innerHTML = "";
        if (!conversations.length) {
          nav.innerHTML = '<div class="empty-state"><strong>No conversations yet</strong>Start one to see it appear here.</div>';
          return;
        }
        conversations.forEach((c) => nav.appendChild(convNavItem(c)));
      }

      function convNavItem(c) {
        const item = document.createElement("div");
        item.className = "conv-nav-item" + (c.id === activeConversationId ? " active" : "");
        item.innerHTML =
          '<span class="conv-nav-title">' + escapeHtml(c.title || "Untitled") + "</span>" +
          '<button class="conv-nav-del" data-role="del" title="Delete conversation" type="button">&times;</button>';

        item.addEventListener("click", (e) => {
          if (e.target.dataset.role === "del") return;
          selectConversation(c.id);
        });

        item.querySelector('[data-role="del"]').addEventListener("click", async (e) => {
          e.stopPropagation();
          await deleteConversation(c);
        });

        return item;
      }

      async function deleteConversation(conv) {
        if (!confirm('Delete "' + (conv.title || "this conversation") + '"? This cannot be undone.')) return;
        try {
          await apiRequest("DELETE", "/conversations/" + conv.id, { auth: true });
          conversations = conversations.filter((c) => c.id !== conv.id);
          renderConvNav();
          if (activeConversationId === conv.id) {
            activeConversationId = null;
            activeConv = null;
            if (conversations.length) selectConversation(conversations[0].id);
            else showEmptyChat();
          }
        } catch (err) {
          if (handleAuthError(err)) return;
          banner("sidebarBanner", err.message, "error");
        }
      }

      $("newChatBtn").addEventListener("click", () => {
        activeConversationId = null;
        activeConv = null;
        renderConvNav();
        showEmptyChat();
        $("newChatPrompt").focus();
      });

      // ===== Main panel: empty state / active conversation =====

      function showEmptyChat() {
        $("chatEmpty").hidden = false;
        $("chatActive").hidden = true;
        banner("chatEmptyBanner", null);
      }

      function showActiveChat() {
        $("chatEmpty").hidden = true;
        $("chatActive").hidden = false;
        banner("chatBanner", null);
      }

      function messageBubble(msg) {
        const div = document.createElement("div");
        div.className = "msg-pair" + (msg.is_success === false ? " failed" : "");
        div.innerHTML =
          '<div class="msg-bubble msg-prompt">' + escapeHtml(msg.prompt_content) + "</div>" +
          '<div class="msg-bubble msg-response">' + escapeHtml(msg.response_content) + "</div>" +
          '<div class="msg-meta">' +
            '<span>' + new Date(msg.created_at).toLocaleString() + "</span>" +
            (msg.total_tokens ? '<span>' + msg.total_tokens + " tokens</span>" : "") +
            (msg.is_success === false ? '<span class="msg-failed-tag">failed</span>' : "") +
          "</div>";
        return div;
      }

      function renderMessages(messages) {
        const threadEl = $("chatThread");
        threadEl.innerHTML = "";
        if (!messages.length) {
          threadEl.innerHTML = '<div class="msg-empty">No messages yet — send the first one below.</div>';
          return;
        }
        messages.forEach((m) => threadEl.appendChild(messageBubble(m)));
        threadEl.scrollTop = threadEl.scrollHeight;
      }

      function renderConvHeader(conv) {
        $("chatTitle").textContent = conv.title || "Untitled";
        $("chatMeta").innerHTML =
          '<span>' + escapeHtml(conv.model_type) + "</span>" +
          '<span>created ' + new Date(conv.created_at).toLocaleString() + "</span>";
      }

      async function selectConversation(id) {
        activeConversationId = id;
        activeConv = conversations.find((c) => c.id === id) || null;
        renderConvNav();
        showActiveChat();
        if (!activeConv) return;

        renderConvHeader(activeConv);
        $("chatThread").innerHTML = '<div class="hint">Loading messages…</div>';
        try {
          const messages = await apiRequest("GET", "/conversations/" + id + "/messages", { auth: true });
          renderMessages(messages);
        } catch (err) {
          if (handleAuthError(err)) return;
          $("chatThread").innerHTML = '<div class="msg-empty">Could not load messages: ' + escapeHtml(err.message) + "</div>";
        }
      }

      // ===== Start a new conversation =====

      $("startConvBtn").addEventListener("click", async () => {
        banner("chatEmptyBanner", null);
        const prompt = $("newChatPrompt").value.trim();
        const modelType = $("newChatModel").value.trim();
        if (!prompt) return banner("chatEmptyBanner", "Write your first message.", "error");
        if (!modelType) return banner("chatEmptyBanner", "Set a model type.", "error");

        const btn = $("startConvBtn");
        btn.disabled = true;
        try {
          const conv = await apiRequest("POST", "/conversations", {
            body: { initial_prompt: prompt, model_type: modelType },
            auth: true,
          });
          $("newChatPrompt").value = "";
          conversations.unshift(conv);
          activeConversationId = conv.id;
          activeConv = conv;
          renderConvNav();
          showActiveChat();
          renderConvHeader(conv);
          $("chatThread").innerHTML = '<div class="msg-empty">No messages yet — send the first one below.</div>';

          // The conversation itself never generates a response server-side -
          // stream the initial prompt as its first message the same way any
          // later message is sent, so it appears live.
          sendMessage(prompt);
        } catch (err) {
          if (handleAuthError(err)) return;
          banner("chatEmptyBanner", err.message, "error");
        } finally {
          btn.disabled = false;
        }
      });

      // ===== Rename / delete active conversation =====

      $("renameBtn").addEventListener("click", async () => {
        if (!activeConv) return;
        const nextTitle = window.prompt("Rename conversation", activeConv.title || "");
        if (nextTitle === null) return;
        const trimmed = nextTitle.trim();
        if (!trimmed || trimmed === activeConv.title) return;

        try {
          const updated = await apiRequest("PUT", "/conversations/" + activeConv.id, {
            body: { title: trimmed, model_type: activeConv.model_type },
            auth: true,
          });
          activeConv = updated;
          const idx = conversations.findIndex((c) => c.id === updated.id);
          if (idx !== -1) conversations[idx] = updated;
          renderConvHeader(updated);
          renderConvNav();
        } catch (err) {
          if (handleAuthError(err)) return;
          banner("chatBanner", err.message, "error");
        }
      });

      $("deleteBtn").addEventListener("click", () => {
        if (activeConv) deleteConversation(activeConv);
      });

      // ===== Send a message (streaming) =====

      async function sendMessage(promptOverride) {
        if (!activeConversationId) return;
        const inputEl = $("chatInput");
        const sendBtn = $("chatSendBtn");
        const prompt = (typeof promptOverride === "string" ? promptOverride : inputEl.value).trim();
        if (!prompt) return;

        sendBtn.disabled = true;
        inputEl.disabled = true;

        const threadEl = $("chatThread");
        const empty = threadEl.querySelector(".msg-empty");
        if (empty) empty.remove();

        const pairEl = document.createElement("div");
        pairEl.className = "msg-pair";
        pairEl.innerHTML =
          '<div class="msg-bubble msg-prompt">' + escapeHtml(prompt) + "</div>" +
          '<div class="msg-bubble msg-response" data-role="live-response"></div>' +
          '<div class="msg-meta" data-role="live-meta"><span>streaming…</span></div>';
        threadEl.appendChild(pairEl);
        threadEl.scrollTop = threadEl.scrollHeight;
        const responseEl = pairEl.querySelector('[data-role="live-response"]');
        const metaEl = pairEl.querySelector('[data-role="live-meta"]');

        const path = "/conversations/" + activeConversationId + "/messages";

        const finish = (finalMessage, note) => {
          if (finalMessage) {
            pairEl.className = "msg-pair" + (finalMessage.is_success === false ? " failed" : "");
            responseEl.textContent = finalMessage.response_content;
            metaEl.innerHTML =
              '<span>' + new Date(finalMessage.created_at).toLocaleString() + "</span>" +
              (finalMessage.total_tokens ? '<span>' + finalMessage.total_tokens + " tokens</span>" : "") +
              (finalMessage.is_success === false ? '<span class="msg-failed-tag">failed</span>' : "");
          } else if (responseEl.textContent) {
            pairEl.classList.add("failed");
            metaEl.innerHTML = '<span class="msg-failed-tag">' + escapeHtml(note || "connection interrupted") + "</span>";
          } else {
            pairEl.remove();
            banner("chatBanner", note || "Something went wrong.", "error");
          }
        };

        try {
          const currentSession = getSession();
          const res = await fetch(getBaseUrl() + path, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + currentSession.token },
            body: JSON.stringify({ prompt }),
          });

          if (res.status === 401) {
            sessionExpired();
            return;
          }

          if (!res.ok || !res.body) {
            const text = await res.text().catch(() => "");
            let detail = text;
            try { detail = JSON.parse(text).detail || text; } catch (e) { /* not JSON, use raw text */ }
            throw new Error(detail || ("Request failed with status " + res.status));
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let finalMessage = null;

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            let sepIndex;
            while ((sepIndex = buffer.indexOf("\n\n")) !== -1) {
              const rawFrame = buffer.slice(0, sepIndex);
              buffer = buffer.slice(sepIndex + 2);
              const dataLine = rawFrame.split("\n").find((l) => l.startsWith("data:"));
              if (!dataLine) continue;
              const payload = JSON.parse(dataLine.slice(5).trim());

              if (payload.type === "chunk") {
                responseEl.textContent += payload.content;
                threadEl.scrollTop = threadEl.scrollHeight;
              } else if (payload.type === "done") {
                finalMessage = payload.message;
              }
            }
          }

          finish(finalMessage, finalMessage ? null : "Stream ended before a final response arrived.");
          if (finalMessage) {
            inputEl.value = "";
            if (finalMessage.is_success === false) {
              banner("chatBanner", "Message saved, but the model call failed — see the reply for details.", "error");
            }
          }
        } catch (err) {
          finish(null, err.message);
        } finally {
          sendBtn.disabled = false;
          inputEl.disabled = false;
        }
      }

      $("chatSendBtn").addEventListener("click", () => sendMessage());
      $("chatInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) sendMessage();
      });

      // ===== Sign out =====

      $("signOutBtn").addEventListener("click", async () => {
        try {
          await apiRequest("POST", "/auth/logout", { auth: true });
        } catch (err) {
          // Token may already be invalid/expired — sign out locally regardless.
        }
        setSession(null, null);
        window.location.href = "login.html";
      });

      // ===== Change password (modal) =====

      $("changePasswordBtn").addEventListener("click", () => {
        $("pwForm").reset();
        banner("pwBanner", null);
        $("pwModal").hidden = false;
      });

      $("pwCancelBtn").addEventListener("click", () => { $("pwModal").hidden = true; });

      $("pwForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        banner("pwBanner", null);
        const cur = $("pwCurrent").value;
        const next = $("pwNew").value;
        const conf = $("pwNewConfirm").value;
        if (!cur || !next) return banner("pwBanner", "Fill in both fields.", "error");
        if (next !== conf) return banner("pwBanner", "New passwords don't match.", "error");

        const btn = $("pwSubmitBtn");
        btn.disabled = true;
        try {
          await apiRequest("POST", "/auth/reset-password", { body: { current_password: cur, new_password: next }, auth: true });
          $("pwModal").hidden = true;
          banner("sidebarBanner", "Password updated.", "success");
        } catch (err) {
          if (handleAuthError(err)) return;
          banner("pwBanner", err.message, "error");
        } finally {
          btn.disabled = false;
        }
      });

      // ===== Boot =====

      loadConversations();
    })();
  }
</script>
</body>
</html>
