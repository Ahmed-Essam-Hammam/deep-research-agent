<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — Deep Research</title>
<link rel="stylesheet" href="shared.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand"><span class="brand-mark">Deep Research</span></div>
    <div class="topbar-right">
      <span class="status-dot" id="statusDot" title="API reachability"></span>
      <button class="linklike" id="apiSettingsBtn" type="button">API settings</button>
    </div>
  </header>

  <div class="api-settings-panel" id="apiSettingsPanel" hidden>
    <div class="field" style="margin-bottom:0;">
      <label for="baseUrlInput">API base URL</label>
      <input id="baseUrlInput" type="text" spellcheck="false" />
    </div>
  </div>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <p class="auth-sub">Confirm your current password, then set a new one. You'll be signed in right after.</p>

      <div id="authBanner"></div>

      <form id="resetForm">
        <div class="field">
          <label for="resetUsername">Username</label>
          <input id="resetUsername" type="text" placeholder="e.g. alice" autocomplete="username" />
        </div>
        <div class="field">
          <label for="resetCurrentPassword">Current password</label>
          <input id="resetCurrentPassword" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div class="field">
          <label for="resetNewPassword">New password</label>
          <input id="resetNewPassword" type="password" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="resetNewPasswordConfirm">Confirm new password</label>
          <input id="resetNewPasswordConfirm" type="password" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <button class="btn btn-primary btn-block" id="resetSubmitBtn" type="submit">Update password</button>
      </form>

      <p class="auth-switch"><a href="login.html">Back to sign in</a></p>
    </div>
  </div>

<script src="shared.js"></script>
<script>
  redirectIfAuthed();
  initTopbar();

  // There's no unauthenticated "forgot password" endpoint on the backend -
  // resetting still requires proving the current password. So this page
  // confirms it the same way signing in does, then immediately changes it.
  $("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    banner("authBanner", null);
    const u = $("resetUsername").value.trim();
    const cur = $("resetCurrentPassword").value;
    const next = $("resetNewPassword").value;
    const conf = $("resetNewPasswordConfirm").value;
    if (!u || !cur || !next) return banner("authBanner", "Fill in your username, current password, and new password.", "error");
    if (next !== conf) return banner("authBanner", "New passwords don't match.", "error");

    const btn = $("resetSubmitBtn");
    btn.disabled = true;
    try {
      let data;
      try {
        data = await apiRequest("POST", "/auth/token", { body: { username: u, password: cur }, form: true });
      } catch (err) {
        throw new Error("Username or current password is incorrect.");
      }
      setSession(data.access_token, u);
      await apiRequest("POST", "/auth/reset-password", {
        body: { current_password: cur, new_password: next },
        auth: true,
      });
      window.location.href = "app.html";
    } catch (err) {
      setSession(null, null);
      banner("authBanner", err.message, "error");
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
