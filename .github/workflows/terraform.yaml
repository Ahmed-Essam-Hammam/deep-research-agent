name: Terraform

# Plan on every infrastructure change pushed to main; apply only after a human approves the
# "terraform-production" environment. This workflow never destroys anything.
on:
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: terraform


# The job performs several operations in order:
# 1. Checks out your GitHub repository.
# 2. Installs Terraform.
# 3. Checks Terraform formatting.
# 4. Authenticates with AWS using OIDC.
# 5. Initializes Terraform and connects to the remote state backend.
# 6. Validates the Terraform configuration.
# 7. Generates a Terraform execution plan.

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # It defines an output for the current job, allowing other jobs in the same workflow to access a value generated by this job.  
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.13"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
      - run: terraform validate
      - name: Plan
        id: plan
          # Normally, GitHub Actions runs Bash scripts with error-sensitive behavior (-e).
          # When -e is enabled, Bash exits the script when certain commands return a nonzero exit code.
          # But there's a problem here.
          # Remember the three possible exit codes of:
          # terraform plan -detailed-exitcode
          # Exit code Meaning
          # 0 Successfully generated a plan; no changes.
          # 1 An error occurred.
          # 2 Successfully generated a plan; changes exist.
          # Notice that exit code 2 doesn't mean failure!
          # However, Bash might interpret it as a failure and terminate the script
          # set +e
          # Temporarily disables automatic termination on nonzero exit codes.

          # terraform plan
          # Prints the output to the terminal.
          # But you want two things:
          # 1. Display the output in GitHub Actions logs.
          # 2. Save the output into a file.
          # That's exactly what tee does.


          # Remember that you executed:
          # terraform plan ... | tee plan.txt
          # This is a pipeline containing two commands:
          # 1. terraform plan
          # 2. tee plan.txt
          # When commands are connected using |, Bash maintains an array called PIPESTATUS.
          # It contains the exit status of each command in the most recently executed pipeline.
          # Suppose Terraform finds changes and returns exit code 2, while tee succeeds and returns 0.

          # Then:
          # PIPESTATUS[0] = 2
          # PIPESTATUS[1] = 0

          # This is Bash's conditional execution syntax.
          # - [ "$code" -eq 1 ]: Checks whether the exit code equals 1.
          # - &&: Executes the next command only if the previous command succeeds.
          # - exit 1: Terminates the script with an error.
          # "If Terraform returned exit code 1, terminate the workflow step because something went wrong."

          # Second condition
          # [ "$code" -eq 2 ] && echo "changes=true" >> "$GITHUB_OUTPUT" || echo "changes=false" >> "$GITHUB_OUTPUT"
          # This checks whether Terraform found infrastructure changes.
          # Let's examine both possibilities:
          # Case A: Terraform returned 2
          # [ "$code" -eq 2 ]
          # The condition succeeds, so Bash executes:
          # echo "changes=true" >> "$GITHUB_OUTPUT"
          # This creates a step output:
          # changes=true
          # Case B: Terraform returned 0
          # The condition fails, so Bash executes the command after ||:
          # echo "changes=false" >> "$GITHUB_OUTPUT"
          # This creates:
          # changes=false
        run: |
          set +e # exit code 2 means "changes present", which is not a failure
          terraform plan -lock-timeout=5m -detailed-exitcode -no-color -out=tfplan | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" -eq 1 ] && exit 1
          [ "$code" -eq 2 ] && echo "changes=true" >> "$GITHUB_OUTPUT" || echo "changes=false" >> "$GITHUB_OUTPUT"
          # Show the plan on the run page for review.
          { echo '## Terraform plan'; echo '```'; head -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"


  apply:
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    # Waits here until a reviewer approves (Settings > Environments > terraform-production).
    environment: terraform-production
    # Same group as deploy.yml: no app rollout while infrastructure is changing.
    concurrency:
      group: aws-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.13"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
      # Re-plans and applies the current code (the plan above is for review). Never destroys by itself.
      - run: terraform apply -auto-approve -lock-timeout=5m