name: Deploy application

# push to main -> test -> build image -> push to ECR -> rolling update on EKS
on:
  push:
    branches: [main]
    paths-ignore: ["terraform/**", ".github/workflows/terraform.yml", "**/*.md"]
  workflow_dispatch: {}

permissions:
  contents: read

# One AWS-touching run at a time (shared with terraform.yml's apply job).
concurrency:
  group: aws-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # Integration tests need a live database and are skipped here (see DEVOPS.md).
      - run: pytest -m "not integration" -q

  deploy:
    needs: test # a failing test or lint run blocks the deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request an OIDC token for AWS
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      NAMESPACE: deep-research
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-arn: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push (tag = commit SHA)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          # Tags are immutable: if a re-run finds this commit's image already pushed, reuse it.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image already in ECR - skipping build."
          else
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi

      - name: Deploy and wait for the rollout
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          kubectl set image deployment/deep-research-agent app="$IMAGE" -n "$NAMESPACE"
          # Fails the job if the new pods never become Ready - success is only reported once
          # Kubernetes confirms the rollout.
          kubectl rollout status deployment/deep-research-agent -n "$NAMESPACE" --timeout=10m

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods -n "$NAMESPACE" || true
          kubectl describe deployment deep-research-agent -n "$NAMESPACE" | tail -n 25 || true
          kubectl logs -n "$NAMESPACE" -l app=deep-research-agent --tail=30 --prefix || true
