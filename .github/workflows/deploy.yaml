name: Deploy application

on:
  push:
    branches: [main]
    # It tells GitHub Actions to skip triggering the workflow when a push or pull request only modifies files matching these paths.
    paths-ignore: ["terraform/**", ".github/workflows/terraform.yml", "**/*.md"]
  workflow_dispatch: {}

# This defines the GitHub token permissions available to the workflow.
# GitHub Actions automatically generates a temporary token called GITHUB_TOKEN for each workflow run. This token allows the workflow to interact with your GitHub repository.
permissions:
  contents: read


# This config controls how GitHub Actions handles multiple workflow runs that belong to the same concurrency group.
# For example, imagine you push three commits in quick succession, triggering three deployment runs. If they all use this concurrency group, GitHub coordinates their execution.
concurrency:
  group: aws-production
  cancel-in-progress: false  # Tells GitHub not to cancel an already-running workflow when another workflow in the same group is triggered.


jobs:
  lint:
    name: Lint (pylint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Pylint (production source)
        run: python -m pylint --disable=R,C --fail-under=7.0 src/ pages/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v

  deploy:
    needs: test # a failing test or lint run blocks the deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request an OIDC token for AWS
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      NAMESPACE: deep-research
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #  v7.0.1
        with:
          persist-credentials: false

      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('OIDC issuer:', payload.iss);
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC subject:', payload.sub);

      - name: Authenticate to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        
      # This step builds a Docker image and pushes it to Amazon ECR (Elastic Container Registry), using the Git commit SHA as the image tag.
      # There is also an important optimization: if an image for the same commit already exists in ECR, it skips rebuilding and pushing it.
      - name: Build and push (tag = commit SHA)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          # Tags are immutable: if a re-run finds this commit's image already pushed, reuse it.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image already in ECR - skipping build."
          else
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi

      # This step deploys the newly built Docker image to your Amazon EKS cluster and waits until Kubernetes confirms that the deployment has successfully rolled out.
      - name: Deploy and wait for the rollout
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          kubectl set image deployment/deep-research-agent app="$IMAGE" -n "$NAMESPACE"
          # Fails the job if the new pods never become Ready - success is only reported once
          # Kubernetes confirms the rollout.
          kubectl rollout status deployment/deep-research-agent -n "$NAMESPACE" --timeout=10m


      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods -n "$NAMESPACE" || true
          kubectl describe deployment deep-research-agent -n "$NAMESPACE" | tail -n 25 || true
          kubectl logs -n "$NAMESPACE" -l app=deep-research-agent --tail=30 --prefix || true